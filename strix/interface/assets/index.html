<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashStrix</title>
    <!-- Fallback to CDN for development, but include critical inline styles for robustness -->
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3.4.19/dist/vue.global.js" crossorigin="anonymous"></script>
    <style>
        /* Base Reset & Colors (Fallback if Tailwind fails) */
        :root {
            --bg-dark: #111827; /* gray-900 */
            --bg-card: #1f2937; /* gray-800 */
            --bg-input: #111827;
            --text-main: #ffffff;
            --text-muted: #9ca3af; /* gray-400 */
            --accent-green: #16a34a; /* green-600 */
            --accent-green-hover: #15803d; /* green-700 */
            --accent-red: #dc2626; /* red-600 */
            --border-color: #374151; /* gray-700 */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: ui-sans-serif, system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Utilities matching Tailwind classes used */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-row { flex-direction: row; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .flex-grow { flex-grow: 1; }
        .h-screen { height: 100vh; }
        .w-full { width: 100%; }
        .hidden { display: none !important; }

        /* Setup Modal (Fixed Positioning) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(17, 24, 39, 0.95);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 28rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Dashboard Layout */
        .layout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            height: calc(100vh - 60px); /* Adjust for header */
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .layout-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            min-height: 0; /* Important for nested scrolling */
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Components */
        input[type="text"], input[type="password"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: var(--accent-green);
        }

        button.primary {
            background-color: var(--accent-green);
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.primary:hover { background-color: var(--accent-green-hover); }
        button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

        button.danger {
            background-color: var(--accent-red);
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
        }

        /* Logs & Terminal */
        .terminal {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            padding: 0.5rem;
            border-radius: 0.25rem;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 0.75rem;
            white-space: pre-wrap;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #1e1e1e;
            border-radius: 0.25rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .chat-message {
            padding: 0.5rem;
            border-radius: 0.5rem;
            max-width: 85%;
            font-size: 0.875rem;
        }
        .chat-user {
            background-color: #374151;
            align-self: flex-end;
        }
        .chat-agent {
            background-color: #065f46;
            align-self: flex-start;
        }

        [v-cloak] { display: none !important; }

        /* Header */
        header {
            padding: 1rem 1.5rem 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body style="background-color: #111827; color: white;">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 flex flex-col items-center justify-center bg-gray-900 z-50" style="position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#111827; z-index:9999;">
        <div id="loading-text" style="color:#22c55e; font-size:1.25rem; font-weight:bold;">Loading DashStrix...</div>
        <div id="error-container" class="hidden" style="margin-top:1rem; padding:1rem; border:1px solid #ef4444; background:rgba(127,29,29,0.5); border-radius:0.5rem; text-align:center; max-width:20rem;">
            <h3 style="color:#f87171; font-weight:bold; margin-bottom:0.5rem;">Application Failed to Start</h3>
            <p id="error-message" style="color:white; font-size:0.875rem;"></p>
        </div>
    </div>

    <div id="app" v-cloak class="flex flex-col h-screen">

        <!-- Setup Screen -->
        <div v-if="!isSetupComplete" class="modal-overlay">
            <div class="modal-content">
                <h1 style="font-size:1.5rem; font-weight:bold; color:var(--accent-green); margin-bottom:1.5rem; text-align:center;">DashStrix Setup</h1>
                <p style="color:var(--text-muted); margin-bottom:1.5rem; text-align:center; font-size:0.875rem;">Please configure your LLM settings to continue.</p>

                <div style="display:flex; flex-direction:column; gap:1rem;">
                    <div>
                        <label style="display:block; font-size:0.875rem; font-weight:500; color:var(--text-muted); margin-bottom:0.25rem;">API Key <span style="color:var(--accent-red)">*</span></label>
                        <input v-model="apiKey" type="password" placeholder="AIzaSy...">
                    </div>
                    <div>
                        <label style="display:block; font-size:0.875rem; font-weight:500; color:var(--text-muted); margin-bottom:0.25rem;">Model Name</label>
                        <input v-model="model" type="text" placeholder="gemini/gemini-1.5-pro">
                    </div>
                    <button @click="completeSetup" :disabled="!apiKey" class="primary w-full" style="margin-top:1rem;">
                        Enter Dashboard
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <template v-else>
            <header>
                <div class="flex items-center">
                    <h1 style="font-size:1.5rem; font-weight:bold; color:var(--accent-green); margin-right:1rem;">DashStrix</h1>
                    <span style="background:#1f2937; font-size:0.75rem; padding:0.25rem 0.5rem; border-radius:0.25rem; border:1px solid #374151;">v0.4.1</span>
                </div>
                <div class="flex items-center" style="gap:1rem;">
                    <div>
                        <span v-if="loading" style="color:#facc15; font-family:monospace;">Scanning...</span>
                        <span v-else-if="status === 'completed'" style="color:#4ade80; font-family:monospace;">Scan Completed</span>
                        <span v-else-if="status === 'failed'" style="color:#f87171; font-family:monospace;">Scan Failed</span>
                        <span v-else style="color:#9ca3af; font-family:monospace;">Ready</span>
                    </div>
                    <button @click="resetSetup" style="background:none; border:none; color:#6b7280; font-size:0.75rem; text-decoration:underline; cursor:pointer;">
                        Reset Key
                    </button>
                </div>
            </header>

            <div class="layout-container">
                <!-- Column 1: Interaction & Chat -->
                <div class="column">
                    <!-- Input Section -->
                    <div class="card" style="flex-shrink:0;">
                        <div style="display:grid; grid-template-columns:1fr; gap:0.75rem; margin-bottom:0.75rem;">
                            <div>
                                <label style="display:block; font-size:0.75rem; font-weight:500; color:var(--text-muted); margin-bottom:0.25rem;">Target (URL or Directory)</label>
                                <input v-model="target" type="text" placeholder="e.g., https://example.com" style="font-size:0.875rem;">
                            </div>
                            <div>
                                <label style="display:block; font-size:0.75rem; font-weight:500; color:var(--text-muted); margin-bottom:0.25rem;">Instructions (Optional)</label>
                                <input v-model="instruction" type="text" placeholder="e.g., Focus on SQL Injection" style="font-size:0.875rem;">
                            </div>
                        </div>

                        <div class="flex justify-between items-center">
                            <div style="font-size:0.75rem; color:#6b7280;">
                                Model: <span style="color:#d1d5db;">{{ model }}</span>
                            </div>
                            <div>
                                <button @click="startScan" :disabled="loading || !target" class="primary" style="font-size:0.875rem;">
                                    Start Scan
                                </button>
                                <button @click="stopScan" v-if="loading" class="danger" style="margin-left:0.5rem; font-size:0.875rem;">
                                    Stop
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Interface -->
                    <div class="card chat-container" style="flex-grow:1; display:flex; flex-direction:column; overflow:hidden;">
                        <h2 style="font-size:0.875rem; font-weight:600; margin-bottom:0.5rem; color:#4ade80; display:flex; align-items:center;">
                            <span style="margin-right:0.5rem;">💬</span> Agent Chat
                        </h2>
                        <div class="chat-history" ref="chatContainer">
                            <div v-if="chatMessages.length === 0" style="color:#6b7280; text-align:center; margin-top:2.5rem; font-style:italic; font-size:0.875rem;">
                                No messages yet. Start a scan to interact with the agent.
                            </div>
                            <div v-for="msg in chatMessages" :key="msg.message_id"
                                class="chat-message"
                                :class="msg.role === 'user' ? 'chat-user' : 'chat-agent'">
                                <div style="font-size:0.65rem; color:#9ca3af; margin-bottom:0.25rem;">{{ msg.role === 'user' ? 'You' : 'Agent' }}</div>
                                <div style="white-space:pre-wrap;">{{ msg.content }}</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:0.5rem; padding-top:0.5rem; border-top:1px solid #374151;">
                            <input v-model="chatInput" @keyup.enter="sendMessage" type="text" placeholder="Type a message..." :disabled="!loading" style="flex-grow:1; font-size:0.875rem;">
                            <button @click="sendMessage" :disabled="!loading || !chatInput" class="primary" style="background-color:#2563eb; font-size:0.875rem;">
                                Send
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Column 2: Execution & Output -->
                <div class="column">
                    <!-- Logs / Terminal -->
                    <div class="card" style="height:50%; display:flex; flex-direction:column;">
                        <h2 style="font-size:0.875rem; font-weight:600; margin-bottom:0.5rem; color:#9ca3af; display:flex; align-items:center; justify-content:space-between;">
                            <span class="flex items-center"><span style="margin-right:0.5rem;">💻</span> Agent Execution Log</span>
                            <span style="background:#111827; padding:0.125rem 0.5rem; border-radius:0.25rem; font-size:0.75rem; color:#6b7280;">Live</span>
                        </h2>
                        <div class="terminal" ref="logContainer">
                            <div v-if="logs.length === 0" style="color:#6b7280; font-style:italic; padding:0.5rem;">Waiting for agent activity...</div>
                            <div v-for="(log, index) in logs" :key="index" style="margin-bottom:0.125rem;">{{ log }}</div>
                        </div>
                    </div>

                    <!-- Tool Executions & Vulnerabilities -->
                    <div class="card" style="height:50%; display:flex; flex-direction:column; overflow:hidden;">
                        <!-- Tabs -->
                        <div style="display:flex; border-bottom:1px solid #374151; margin-bottom:0.5rem;">
                            <button @click="activeTab = 'tools'"
                                :style="{ color: activeTab === 'tools' ? '#c084fc' : '#6b7280', borderBottom: activeTab === 'tools' ? '2px solid #c084fc' : 'none' }"
                                style="background:none; padding:0.25rem 0.75rem; font-size:0.875rem; font-weight:500; cursor:pointer;">
                                🔧 Tools
                            </button>
                            <button @click="activeTab = 'vulns'"
                                :style="{ color: activeTab === 'vulns' ? '#f87171' : '#6b7280', borderBottom: activeTab === 'vulns' ? '2px solid #f87171' : 'none' }"
                                style="background:none; padding:0.25rem 0.75rem; font-size:0.875rem; font-weight:500; cursor:pointer;">
                                🛡️ Vulnerabilities <span v-if="vulnerabilities.length" style="background:#7f1d1d; color:#fecaca; font-size:0.65rem; padding:0.125rem 0.375rem; border-radius:9999px; margin-left:0.25rem;">{{ vulnerabilities.length }}</span>
                            </button>
                        </div>

                        <!-- Tool Content -->
                        <div v-if="activeTab === 'tools'" style="flex-grow:1; overflow-y:auto; padding-right:0.25rem; display:flex; flex-direction:column; gap:0.5rem;">
                             <div v-if="toolExecutions.length === 0" style="color:#6b7280; text-align:center; margin-top:2.5rem; font-style:italic; font-size:0.875rem;">
                                No tools executed yet.
                            </div>
                            <div v-for="exec in toolExecutions" :key="exec.id" style="background:#111827; padding:0.5rem; border-radius:0.25rem; border:1px solid #374151; font-family:monospace; font-size:0.75rem;">
                                <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;">
                                    <span style="color:#d8b4fe; font-weight:bold;">{{ exec.tool }}</span>
                                    <span :style="{ color: exec.status === 'completed' ? '#4ade80' : (exec.status === 'failed' ? '#f87171' : '#facc15') }">{{ exec.status }}</span>
                                </div>
                                <div style="color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" :title="exec.args">Args: {{ exec.args }}</div>
                                <div v-if="exec.result" style="color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0.25rem; border-top:1px solid #1f2937; padding-top:0.25rem;" :title="exec.result">-> {{ exec.result }}</div>
                            </div>
                        </div>

                        <!-- Vulnerabilities Content -->
                        <div v-if="activeTab === 'vulns'" style="flex-grow:1; overflow-y:auto; padding-right:0.25rem; display:flex; flex-direction:column; gap:0.5rem;">
                            <div v-if="vulnerabilities.length === 0" style="color:#6b7280; text-align:center; margin-top:2.5rem; font-style:italic; font-size:0.875rem;">
                                No vulnerabilities found yet.
                            </div>
                            <div v-for="vuln in vulnerabilities" :key="vuln.id" style="background:#111827; padding:0.75rem; border-radius:0.25rem; border:1px solid #374151; cursor:pointer;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.25rem;">
                                    <h3 style="font-weight:bold; color:white; font-size:0.875rem;">{{ vuln.title }}</h3>
                                    <span :style="{
                                        backgroundColor: vuln.severity === 'critical' ? '#7f1d1d' : (vuln.severity === 'high' ? '#7c2d12' : (vuln.severity === 'medium' ? '#713f12' : '#1e3a8a')),
                                        color: vuln.severity === 'critical' ? '#fecaca' : (vuln.severity === 'high' ? '#ffedd5' : (vuln.severity === 'medium' ? '#fef9c3' : '#bfdbfe'))
                                    }" style="font-size:0.65rem; padding:0.125rem 0.375rem; border-radius:0.25rem; text-transform:uppercase; font-weight:bold;">{{ vuln.severity }}</span>
                                </div>
                                <p style="font-size:0.75rem; color:#6b7280;">{{ vuln.timestamp }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        // Global error handler
        function showError(msg) {
            const loading = document.getElementById('loading-indicator');
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            const loadingText = document.getElementById('loading-text');

            if (loading && errorContainer && errorMessage) {
                loadingText.style.display = 'none';
                errorContainer.classList.remove('hidden');
                errorContainer.style.display = 'block'; // Ensure inline style
                errorMessage.textContent = msg;
                loading.style.display = 'flex'; // Ensure visible
            }
            console.error('Global Error:', msg);
        }

        window.onerror = function(msg, url, line, col, error) {
            showError(msg);
            return false;
        };

        // Wrap initialization in a try-catch block
        document.addEventListener('DOMContentLoaded', () => {
            try {
                // Check if Vue is loaded
                if (typeof Vue === 'undefined') {
                    throw new Error("Vue.js failed to load. Please check your internet connection.");
                }

                const { createApp, ref, onMounted, watch } = Vue

                createApp({
                    setup() {
                        // Persistent State
                        const isSetupComplete = ref(false)

                        // App State
                        const target = ref('')
                        const instruction = ref('')
                        const apiKey = ref('')
                        const model = ref('gemini/gemini-1.5-pro')
                        const loading = ref(false)
                        const activeTab = ref('tools')

                        // Data State
                        const logs = ref([])
                        const vulnerabilities = ref([])
                        const activities = ref([])
                        const toolExecutions = ref([])
                        const chatMessages = ref([])
                        const chatInput = ref('')
                        const status = ref('idle')

                        // Refs
                        const logContainer = ref(null)
                        const chatContainer = ref(null)
                        let pollInterval = null

                        onMounted(() => {
                            // Hide loading indicator when Vue mounts
                            const loadingEl = document.getElementById('loading-indicator');
                            if (loadingEl) loadingEl.style.display = 'none';

                            // Check local storage for setup
                            const storedKey = localStorage.getItem('strix_api_key');
                            const storedModel = localStorage.getItem('strix_model');

                            if (storedKey) {
                                apiKey.value = storedKey;
                                if (storedModel) model.value = storedModel;
                                isSetupComplete.value = true;
                            }
                        });

                        const completeSetup = () => {
                            if (apiKey.value) {
                                localStorage.setItem('strix_api_key', apiKey.value);
                                localStorage.setItem('strix_model', model.value);
                                isSetupComplete.value = true;
                            }
                        }

                        const resetSetup = () => {
                            localStorage.removeItem('strix_api_key');
                            localStorage.removeItem('strix_model');
                            apiKey.value = '';
                            isSetupComplete.value = false;
                        }

                        const startScan = async () => {
                            try {
                                loading.value = true
                                status.value = 'starting'
                                logs.value = ['Starting scan...']
                                vulnerabilities.value = []
                                activities.value = []
                                toolExecutions.value = []
                                chatMessages.value = []

                                const response = await fetch('/api/scan/start', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        target: target.value,
                                        instruction: instruction.value,
                                        api_key: apiKey.value,
                                        model: model.value
                                    })
                                })

                                if (!response.ok) {
                                    throw new Error('Failed to start scan')
                                }

                                startPolling()
                            } catch (e) {
                                console.error(e)
                                logs.value.push(`Error: ${e.message}`)
                                loading.value = false
                                status.value = 'error'
                            }
                        }

                        const stopScan = async () => {
                            try {
                                await fetch('/api/scan/stop', { method: 'POST' })
                                loading.value = false
                                stopPolling()
                                logs.value.push('Scan stopped by user.')
                            } catch (e) {
                                console.error(e)
                            }
                        }

                        const sendMessage = async () => {
                            if (!chatInput.value.trim()) return

                            const message = chatInput.value
                            chatInput.value = ''

                            // Optimistic update
                            chatMessages.value.push({ role: 'user', content: message, message_id: 'temp-' + Date.now() })

                            try {
                                await fetch('/api/scan/chat', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ message })
                                })
                            } catch (e) {
                                console.error('Failed to send message', e)
                                logs.value.push('Failed to send message: ' + e.message)
                            }
                        }

                        const pollStatus = async () => {
                            try {
                                const response = await fetch('/api/scan/status')
                                const data = await response.json()

                                loading.value = data.running
                                status.value = data.status
                                vulnerabilities.value = data.vulnerabilities || []
                                activities.value = data.activities || []
                                toolExecutions.value = data.tool_executions || []
                                chatMessages.value = data.chat_history || []

                                if (data.logs && data.logs.length > 0) {
                                     logs.value = data.logs
                                }

                                if (!data.running && data.status !== 'starting') {
                                    stopPolling()
                                }
                            } catch (e) {
                                console.error('Polling error', e)
                            }
                        }

                        const startPolling = () => {
                            stopPolling()
                            pollInterval = setInterval(pollStatus, 2000)
                        }

                        const stopPolling = () => {
                            if (pollInterval) {
                                clearInterval(pollInterval)
                                pollInterval = null
                            }
                        }

                        // Auto-scroll logs
                        watch(logs, () => {
                            if (logContainer.value) {
                                 setTimeout(() => {
                                    logContainer.value.scrollTop = logContainer.value.scrollHeight
                                 }, 100)
                            }
                        }, { deep: true })

                        // Auto-scroll chat
                        watch(chatMessages, () => {
                            if (chatContainer.value) {
                                 setTimeout(() => {
                                    chatContainer.value.scrollTop = chatContainer.value.scrollHeight
                                 }, 100)
                            }
                        }, { deep: true })

                        return {
                            isSetupComplete,
                            completeSetup,
                            resetSetup,
                            target,
                            instruction,
                            apiKey,
                            model,
                            loading,
                            activeTab,
                            logs,
                            vulnerabilities,
                            activities,
                            toolExecutions,
                            chatMessages,
                            chatInput,
                            status,
                            startScan,
                            stopScan,
                            sendMessage,
                            logContainer,
                            chatContainer
                        }
                    }
                }).mount('#app')
            } catch (e) {
                showError("Initialization Error: " + e.message);
            }
        });
    </script>
</body>
</html>
